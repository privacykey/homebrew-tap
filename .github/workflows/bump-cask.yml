name: Bump cask

# Triggered either by:
#   - a maintainer clicking "Run workflow" in the Actions tab
#   - the source repo dispatching a `cask-bump` event after a release
#
# In both cases we resolve a target tag, fetch the DMG from the matching
# GitHub Release, recompute sha256, rewrite the cask, and open a PR. The PR
# is intentional — it gives a human one last look before users start
# downloading a build that doesn't exist or is broken.
on:
  workflow_dispatch:
    inputs:
      cask:
        description: "Cask to bump (filename without .rb)"
        type: string
        required: true
        default: privacycommand
      tag:
        description: "Release tag (e.g. v0.2.0). Leave blank to use the latest release."
        type: string
        required: false
        default: ""
  repository_dispatch:
    # Source repos send: { event_type: cask-bump, client_payload: { cask, tag } }
    types: [cask-bump]

permissions:
  contents: write
  pull-requests: write

concurrency:
  # One bump at a time per cask — avoids two parallel runs racing on the same file.
  group: bump-${{ github.event.inputs.cask || github.event.client_payload.cask }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v6

      - name: Resolve cask + tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cask="${{ github.event.inputs.cask || github.event.client_payload.cask }}"
          tag="${{ github.event.inputs.tag || github.event.client_payload.tag }}"

          if [[ -z "$cask" ]]; then
            echo "::error::cask is required (workflow input or client_payload.cask)"
            exit 1
          fi

          # Default the source repo to privacykey/<cask>; override via payload.
          repo="${{ github.event.client_payload.repo }}"
          repo="${repo:-privacykey/${cask}}"

          if [[ -z "$tag" ]]; then
            # Latest release == most recent non-draft, non-prerelease.
            tag="$(gh release view --repo "$repo" --json tagName -q .tagName)"
            echo "Resolved latest tag: $tag"
          fi

          echo "cask=$cask"   >>"$GITHUB_OUTPUT"
          echo "tag=$tag"     >>"$GITHUB_OUTPUT"
          echo "repo=$repo"   >>"$GITHUB_OUTPUT"

      - name: Bump cask
        id: bump
        env:
          REPO: ${{ steps.resolve.outputs.repo }}
        run: |
          chmod +x scripts/bump-cask.sh
          scripts/bump-cask.sh "${{ steps.resolve.outputs.cask }}" "${{ steps.resolve.outputs.tag }}"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bump/${{ steps.bump.outputs.cask }}-${{ steps.bump.outputs.version }}
          base: main
          commit-message: "${{ steps.bump.outputs.cask }} ${{ steps.bump.outputs.version }}"
          title: "${{ steps.bump.outputs.cask }} ${{ steps.bump.outputs.version }}"
          body: |
            Automated bump triggered by `${{ github.event_name }}`.

            - **Cask:** `${{ steps.bump.outputs.cask }}`
            - **Version:** `${{ steps.bump.outputs.version }}`
            - **SHA-256:** `${{ steps.bump.outputs.sha256 }}`
            - **Asset:** ${{ steps.bump.outputs.asset_url }}

            Merge to publish to tap users.
          labels: |
            cask-bump
            automated
          delete-branch: true
